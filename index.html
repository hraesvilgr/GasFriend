<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gas Finder</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#667085; --line:#e4e7ec;
    --accent:#0b6bcb; --accent-ink:#fff; --good:#12805c; --warn:#b54708;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1216; --card:#181c22; --ink:#e8eaed; --muted:#98a2b3; --line:#2a3039;
      --accent:#4c9ffe; --accent-ink:#0b1220; --good:#3ccf91; --warn:#f5a524; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{display:flex;flex-direction:column}
  header{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--card);
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:17px;margin:0 auto 0 0}
  select,button,input,textarea{font:inherit;color:inherit}
  select,input[type=text],input[type=password],textarea{
    background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
  .tabs button{flex:1;border:0;border-radius:0;background:none;padding:10px;color:var(--muted);
    border-bottom:2px solid transparent}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  main{flex:1;position:relative;min-height:0}
  #list,#mapWrap{position:absolute;inset:0}
  #list{overflow:auto;padding:8px 10px 24px}
  #map{position:absolute;inset:0}
  #searchHere{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;display:none;
    box-shadow:0 2px 8px rgba(0,0,0,.25)}
  #mapStatus{position:absolute;left:10px;right:10px;bottom:16px;z-index:5;background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.25)}
  #mapStatus.err{color:var(--warn);border-color:var(--warn)}
  .hidden{display:none!important}
  .status{color:var(--muted);padding:10px 4px;font-size:14px}
  .status.err{color:var(--warn)}
  .st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    margin:8px 0;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
  .st .name{font-weight:600}
  .st .addr{color:var(--muted);font-size:13px;grid-column:1}
  .st .price{grid-row:1 / span 2;grid-column:2;text-align:right;font-size:20px;font-weight:700;white-space:nowrap}
  .st .price small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
  .st .price.none{font-size:14px;font-weight:400;color:var(--muted)}
  .st .meta{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:14px}
  .st a.nav{color:var(--accent);text-decoration:none;font-weight:600}
  .st.best{border-color:var(--good)}
  .st.best .price{color:var(--good)}
  .pin{background:var(--card);color:var(--ink);border:2px solid var(--accent);border-radius:14px;
    padding:2px 7px;font-weight:700;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.3);white-space:nowrap}
  .pin.none{border-color:var(--muted);color:var(--muted);font-weight:400}
  .pin.best{border-color:var(--good);color:var(--good)}
  .me{width:14px;height:14px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
  dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);
    width:min(520px,94vw);padding:16px}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
  dialog .hint{color:var(--muted);font-size:13px;margin-top:3px}
  dialog input[type=password],dialog textarea{width:100%}
  dialog textarea{min-height:130px}
  .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .iw{color:#1b1f24;font-size:14px;max-width:240px}
  .iw b{display:block;margin-bottom:2px}
  .iw a{color:#0b6bcb;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>⛽ Gas Finder</h1>
  <select id="fuel" aria-label="Fuel type">
    <option value="REGULAR_UNLEADED">Regular</option>
    <option value="MIDGRADE">Midgrade</option>
    <option value="PREMIUM">Premium</option>
    <option value="DIESEL">Diesel</option>
    <option value="E85">E85</option>
  </select>
  <select id="sort" aria-label="Sort">
    <option value="drive">Closest drive</option>
    <option value="price">Cheapest</option>
  </select>
  <button id="locate" title="Refresh stations near me">📍</button>
  <button id="openSettings" title="Settings">⚙️</button>
</header>
<div class="tabs">
  <button id="tabList" class="on">List</button>
  <button id="tabMap">Map</button>
</div>
<main>
  <div id="list"><div class="status" id="status">Starting…</div><div id="items"></div></div>
  <div id="mapWrap" class="hidden">
    <div id="map"></div>
    <button id="searchHere" class="primary">Search this area</button>
    <div id="mapStatus" class="hidden"></div>
  </div>
</main>

<dialog id="settings">
  <h2 style="margin:0 0 4px;font-size:18px">Settings</h2>
  <label for="apiKey">Google Maps API key</label>
  <input id="apiKey" type="password" autocomplete="off" placeholder="AIza…">
  <div class="hint">Needs Maps JavaScript API, Places API (New) and Routes API turned on. Stored only in this browser.</div>

  <label for="blocklist">Never show stations matching (one per line)</label>
  <textarea id="blocklist"></textarea>
  <div class="hint">Matches whole words in the station name, case-insensitive.</div>

  <label style="display:flex;gap:8px;align-items:center;font-weight:400">
    <input id="hideNoPrice" type="checkbox"> Hide stations with no price for this fuel
  </label>

  <div class="row">
    <button id="cancelSettings">Cancel</button>
    <button id="saveSettings" class="primary">Save</button>
  </div>
</dialog>

<script>
(() => {
  // ---------- settings (localStorage is optional; everything works without it) ----------
  const DEFAULTS = {
    apiKey: "",
    blocklist: ["Costco", "Sam's Club", "MCX", "Marine Corps Exchange", "Marine Mart"],
    fuel: "REGULAR_UNLEADED",
    sort: "drive",
    hideNoPrice: false
  };
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  let S = Object.assign({}, DEFAULTS, load("gasFinder", {}));
  const saveS = () => save("gasFinder", S);

  const $ = id => document.getElementById(id);
  const statusEl = $("status"), itemsEl = $("items"), mapStatusEl = $("mapStatus");
  function setStatus(msg, err=false) {
    statusEl.textContent = msg || ""; statusEl.classList.toggle("err", err); statusEl.classList.toggle("hidden", !msg);
  }
  let mapStatusTimer;
  function setMapStatus(msg, err=false, sticky=false) {
    clearTimeout(mapStatusTimer);
    mapStatusEl.textContent = msg || "";
    mapStatusEl.classList.toggle("err", err);
    mapStatusEl.classList.toggle("hidden", !msg);
    if (msg && !sticky && !err) mapStatusTimer = setTimeout(() => mapStatusEl.classList.add("hidden"), 5000);
  }

  $("fuel").value = S.fuel;
  $("sort").value = S.sort;

  // ---------- constants ----------
  const NEAR_RADIUS_M = 50000;          // max Google allows; results are ranked nearest-first anyway
  const CACHE_MAX_AGE_MS = 10 * 60000;  // reuse a GPS search for 10 min…
  const CACHE_MAX_MOVE_M = 500;         // …if you've moved less than 500 m

  // ---------- state ----------
  let map, PlaceCls, RankPref, RouteMatrix, AdvMarker;
  let myPos = null;
  let nearList = [];        // GPS search (List tab)
  let nearNote = "";
  let areaList = null;      // last "Search this area" (Map tab); null = show nearList
  let markers = [], meMarker = null, infoWin = null;
  let mapFittedToNear = false;

  // ---------- helpers ----------
  const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const norm = s => (s || "").replace(/[‘’]/g, "'");
  function isBlocked(name) {
    const n = norm(name);
    return S.blocklist.some(t => {
      t = norm(t).trim(); if (!t) return false;
      return new RegExp("(^|[^\\w])" + escapeRe(t) + "($|[^\\w])", "i").test(n);
    });
  }
  function moneyToNum(m) {
    if (m == null) return null;
    if (typeof m === "number") return m;
    const v = Number(m.units ?? 0) + Number(m.nanos ?? 0) / 1e9;
    return Number.isFinite(v) && v > 0 ? v : null;
  }
  function shortAddr(p) {
    if (p.shortFormattedAddress) return p.shortFormattedAddress;
    // Fallback: drop country, ZIP and state from "123 Main St, City, CA 92101, USA"
    let a = p.formattedAddress || "";
    a = a.replace(/,\s*(USA|United States)$/i, "");
    a = a.replace(/,\s*[A-Z]{2}\s+\d{5}(-\d{4})?$/, "");
    return a;
  }
  function ago(d) {
    if (!d) return "";
    const t = new Date(d).getTime();
    if (!Number.isFinite(t)) return "";
    const mins = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (mins < 60) return mins + "m ago";
    const h = Math.round(mins / 60);
    return h < 48 ? h + "h ago" : Math.round(h / 24) + "d ago";
  }
  function meters(a, b) {
    const R = 6371000, toR = x => x * Math.PI / 180;
    const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
    const h = Math.sin(dLat/2)**2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function fmtDrive(s) {
    if (s.driveMeters == null) return s.routeFailed ? "No drive route" : (s.noRoute ? "" : "Drive distance…");
    const mi = s.driveMeters / 1609.344;
    const min = Math.max(1, Math.round(s.driveSecs / 60));
    return (mi < 10 ? mi.toFixed(1) : Math.round(mi)) + " mi · " + min + " min drive";
  }
  const navUrl = s => "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=" +
    s.lat + "," + s.lng + "&destination_place_id=" + encodeURIComponent(s.id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function friendlyError(e, what) {
    const m = String(e?.message || e || "");
    if (/RESOURCE_EXHAUSTED|quota|429/i.test(m))
      return what + " limit reached for today (the daily quota you set). It resets at midnight Pacific.";
    if (/PERMISSION_DENIED|API key|not authorized|403/i.test(m))
      return what + " was refused. Check the API is enabled and allowed on your key.";
    return what + " failed: " + m;
  }

  // ---------- Google Maps loading ----------
  function loadMaps(key) {
    return new Promise((resolve, reject) => {
      window.__gfReady = resolve;
      window.gm_authFailure = () => {
        const m = "Google rejected the API key. Check it's valid, the three APIs are enabled, and this site is allowed under the key's restrictions.";
        setStatus(m, true); setMapStatus(m, true);
      };
      const s = document.createElement("script");
      s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key) +
              "&v=weekly&loading=async&callback=__gfReady";
      s.async = true;
      s.onerror = () => reject(new Error("Couldn't load Google Maps. Check your connection."));
      document.head.append(s);
    });
  }

  async function init() {
    if (!S.apiKey) { setStatus("Add your Google Maps API key in ⚙️ Settings to get started."); openSettings(); return; }
    setStatus("Loading Google Maps…");
    try { await loadMaps(S.apiKey); }
    catch (e) { setStatus(e.message, true); return; }

    const { Map } = await google.maps.importLibrary("maps");
    ({ Place: PlaceCls, SearchNearbyRankPreference: RankPref } = await google.maps.importLibrary("places"));
    ({ RouteMatrix } = await google.maps.importLibrary("routes"));
    ({ AdvancedMarkerElement: AdvMarker } = await google.maps.importLibrary("marker"));

    map = new Map($("map"), {
      center: { lat: 39.5, lng: -98.35 }, zoom: 4, mapId: "DEMO_MAP_ID",
      disableDefaultUI: true, zoomControl: true, gestureHandling: "greedy", clickableIcons: false
    });
    infoWin = new google.maps.InfoWindow();
    map.addListener("dragend", () => { $("searchHere").style.display = "block"; });
    map.addListener("zoom_changed", () => { if (mapFittedToNear || areaList) $("searchHere").style.display = "block"; });

    refreshNear(false);
  }

  // ---------- GPS: 20 nearest stations (List tab) ----------
  function getPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error("no geolocation"));
      navigator.geolocation.getCurrentPosition(
        p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
        reject, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
    });
  }

  async function refreshNear(force) {
    setStatus("Finding your location…");
    try { myPos = await getPosition(); }
    catch {
      setStatus("Couldn't get your GPS location. Allow location access for this page, then tap 📍.", true);
      return;
    }
    showMe();

    // Reuse a recent search from about the same spot (saves quota)
    const cache = load("gasFinderNear", null);
    if (!force && cache && Date.now() - cache.time < CACHE_MAX_AGE_MS && meters(cache.pos, myPos) < CACHE_MAX_MOVE_M) {
      nearList = cache.stations; nearNote = cache.note || "";
      renderList(); if (!areaList) { drawMarkers(); fitToNear(); }
      return;
    }

    setStatus("Searching for the nearest stations…");
    let res;
    try { res = await searchStations(myPos, NEAR_RADIUS_M); }
    catch (e) { setStatus(friendlyError(e, "Station search"), true); return; }
    nearList = res.stations; nearNote = res.note;
    renderList(); if (!areaList) { drawMarkers(); fitToNear(); }

    // Drive distances for the list
    const routeNote = await addDriveDistances(nearList, myPos);
    nearNote = res.note + routeNote;
    renderList(); if (!areaList) drawMarkers();
    if (!routeNote) save("gasFinderNear", { time: Date.now(), pos: myPos, stations: nearList, note: nearNote });
  }

  function showMe() {
    if (!myPos || !map) return;
    const el = document.createElement("div"); el.className = "me";
    if (meMarker) meMarker.map = null;
    meMarker = new AdvMarker({ map, position: myPos, content: el, title: "You", zIndex: 1000 });
  }

  // ---------- shared search ----------
  async function searchStations(center, radius) {
    const { places } = await PlaceCls.searchNearby({
      fields: ["id", "displayName", "location", "shortFormattedAddress", "formattedAddress", "fuelOptions"],
      locationRestriction: { center, radius: Math.round(Math.min(50000, Math.max(500, radius))) },
      includedPrimaryTypes: ["gas_station"],
      maxResultCount: 20,
      rankPreference: RankPref.DISTANCE
    });
    let blocked = 0;
    const stations = (places || []).filter(p => isBlocked(p.displayName) ? (blocked++, false) : true).map(p => {
      const prices = {};
      for (const fp of (p.fuelOptions?.fuelPrices || [])) {
        const v = moneyToNum(fp.price);
        if (v != null) prices[String(fp.type)] = { price: v, updated: fp.updateTime ? new Date(fp.updateTime).toISOString() : null };
      }
      return { id: p.id, name: p.displayName, addr: shortAddr(p),
               lat: p.location.lat(), lng: p.location.lng(), prices,
               driveMeters: null, driveSecs: null, routeFailed: false, noRoute: false };
    });
    const note = blocked ? ` · ${blocked} blocked hidden` : "";
    return { stations, note, full: (places || []).length >= 20 };
  }

  async function addDriveDistances(list, origin) {
    if (list.length < 2) {           // Routes matrix needs 2+ destinations
      list.forEach(s => s.noRoute = true);
      return "";
    }
    try {
      const { matrix } = await RouteMatrix.computeRouteMatrix({
        origins: [origin],
        destinations: list.map(s => ({ lat: s.lat, lng: s.lng })),
        travelMode: "DRIVING",
        fields: ["distanceMeters", "durationMillis", "condition"]
      });
      const items = matrix?.rows?.[0]?.items || [];
      items.forEach((it, i) => {
        const s = list[i]; if (!s) return;
        if (it && it.distanceMeters != null && String(it.condition ?? "ROUTE_EXISTS") === "ROUTE_EXISTS") {
          s.driveMeters = it.distanceMeters; s.driveSecs = (it.durationMillis ?? 0) / 1000;
        } else s.routeFailed = true;
      });
      return "";
    } catch (e) {
      list.forEach(s => s.routeFailed = true);
      return " · " + friendlyError(e, "Drive distance");
    }
  }

  // ---------- Map tab: search the visible area ----------
  async function searchArea() {
    $("searchHere").style.display = "none";
    const c = map.getCenter(), b = map.getBounds();
    const center = { lat: c.lat(), lng: c.lng() };
    // radius = center to the nearer edge of the view, so results fill what you see
    let radius = 50000;
    if (b) {
      const ne = b.getNorthEast(), sw = b.getSouthWest();
      const halfH = meters(center, { lat: ne.lat(), lng: center.lng });
      const halfW = meters(center, { lat: center.lat, lng: ne.lng() });
      radius = Math.min(halfH, halfW, 50000);
    }
    setMapStatus("Searching this area…", false, true);
    let res;
    try { res = await searchStations(center, radius); }
    catch (e) { setMapStatus(friendlyError(e, "Station search"), true); return; }
    areaList = res.stations;
    areaList.forEach(s => s.noRoute = true);   // map pins skip drive distances to save quota
    drawMarkers();                              // keep the view where you put it
    let msg = `${areaList.length} stations${res.note}`;
    if (res.full) msg += " · only the 20 nearest the center. Zoom in for more detail.";
    if (radius >= 50000) msg += " · search capped at 31 mi from center.";
    setMapStatus(msg, false, res.full);
  }

  function fitToNear() {
    if (!map || !nearList.length) return;
    const b = new google.maps.LatLngBounds();
    nearList.forEach(s => b.extend({ lat: s.lat, lng: s.lng }));
    if (myPos) b.extend(myPos);
    map.fitBounds(b, 40);
    mapFittedToNear = true;
    $("searchHere").style.display = "none";
  }

  // ---------- rendering ----------
  function sortList(list) {
    const fuel = S.fuel;
    let out = list.slice();
    if (S.hideNoPrice) out = out.filter(s => s.prices[fuel]);
    const p = s => s.prices[fuel]?.price ?? Infinity;
    const d = s => s.driveMeters ?? Infinity;
    out.sort(S.sort === "price" ? (a, b) => (p(a) - p(b)) || (d(a) - d(b))
                                : (a, b) => (d(a) - d(b)) || (p(a) - p(b)));
    return out;
  }
  const minPrice = list => Math.min(...list.map(s => s.prices[S.fuel]?.price ?? Infinity));

  function renderList() {
    const fuel = S.fuel, list = sortList(nearList), min = minPrice(list);
    if (!list.length) {
      itemsEl.innerHTML = "";
      setStatus((nearList.length ? "No stations with a price for this fuel nearby." : "No stations found near you.") + nearNote);
      return;
    }
    const priced = list.filter(s => s.prices[fuel]).length;
    setStatus(`${list.length} nearest stations · ${priced} with ${$("fuel").selectedOptions[0].text.toLowerCase()} prices${nearNote}`);
    itemsEl.innerHTML = list.map(s => {
      const fp = s.prices[fuel], best = fp && fp.price === min;
      const price = fp
        ? `<div class="price">$${fp.price.toFixed(2)}<small>${esc(ago(fp.updated))}</small></div>`
        : `<div class="price none">No price</div>`;
      return `<div class="st${best ? " best" : ""}">
        <div class="name">${esc(s.name)}</div>${price}
        <div class="addr">${esc(s.addr)}</div>
        <div class="meta"><span>${esc(fmtDrive(s))}</span>
          <a class="nav" href="${navUrl(s)}" target="_blank" rel="noopener">Navigate ›</a></div>
      </div>`;
    }).join("");
  }

  function drawMarkers() {
    if (!map) return;
    markers.forEach(m => m.map = null); markers = [];
    const list = sortList(areaList || nearList), min = minPrice(list), fuel = S.fuel;
    for (const s of list) {
      const fp = s.prices[fuel];
      const el = document.createElement("div");
      el.className = "pin" + (fp ? (fp.price === min ? " best" : "") : " none");
      el.textContent = fp ? "$" + fp.price.toFixed(2) : "—";
      const m = new AdvMarker({ map, position: { lat: s.lat, lng: s.lng }, content: el, title: s.name, gmpClickable: true });
      m.addListener("click", () => {
        const drive = fmtDrive(s);
        infoWin.setContent(`<div class="iw"><b>${esc(s.name)}</b>${esc(s.addr)}<br>` +
          (fp ? "$" + fp.price.toFixed(2) + " · " + esc(ago(fp.updated)) + "<br>" : "") +
          (drive ? esc(drive) + "<br>" : "") +
          `<a href="${navUrl(s)}" target="_blank" rel="noopener">Navigate ›</a></div>`);
        infoWin.open({ map, anchor: m });
      });
      markers.push(m);
    }
  }
  function renderAll() { renderList(); drawMarkers(); }

  // ---------- UI wiring ----------
  function showTab(which) {
    const isMap = which === "map";
    $("tabMap").classList.toggle("on", isMap);
    $("tabList").classList.toggle("on", !isMap);
    $("mapWrap").classList.toggle("hidden", !isMap);
    $("list").classList.toggle("hidden", isMap);
  }
  $("tabList").onclick = () => showTab("list");
  $("tabMap").onclick = () => showTab("map");
  $("fuel").onchange = e => { S.fuel = e.target.value; saveS(); renderAll(); };
  $("sort").onchange = e => { S.sort = e.target.value; saveS(); renderAll(); };
  $("locate").onclick = () => {
    if (!map) return;
    areaList = null; setMapStatus("");
    refreshNear(true);
  };
  $("searchHere").onclick = () => searchArea();

  const dlg = $("settings");
  function openSettings() {
    $("apiKey").value = S.apiKey;
    $("blocklist").value = S.blocklist.join("\n");
    $("hideNoPrice").checked = !!S.hideNoPrice;
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  }
  $("openSettings").onclick = openSettings;
  $("cancelSettings").onclick = () => dlg.close();
  $("saveSettings").onclick = () => {
    const newKey = $("apiKey").value.trim();
    const keyChanged = newKey !== S.apiKey;
    const newBlock = $("blocklist").value.split("\n").map(x => x.trim()).filter(Boolean);
    const blockChanged = newBlock.join("\n") !== S.blocklist.join("\n");
    S.apiKey = newKey; S.blocklist = newBlock; S.hideNoPrice = $("hideNoPrice").checked;
    saveS();
    dlg.close();
    if (keyChanged) { location.reload(); return; }
    if (blockChanged) {
      // re-filter what we already have instead of spending a new search
      nearList = nearList.filter(s => !isBlocked(s.name));
      if (areaList) areaList = areaList.filter(s => !isBlocked(s.name));
      save("gasFinderNear", null);
    }
    renderAll();
  };

  init();
})();
</script>
</body>
</html>
